<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Contact — Bibliothèque</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<header class="site-header"><nav class="navbar container"><a class="brand" href="index.html">Biblio<span>thèque</span></a><button class="menu-toggle" aria-label="Ouvrir le menu" aria-expanded="false">☰</button><div class="nav-links"><a href="index.html">Accueil</a><a href="catalogue.html">Catalogue</a><a href="apropos.html">À propos</a><a class="active" href="contact.html">Contact</a></div></nav></header>
<main class="container section narrow">
  <p class="eyebrow">Restons en contact</p><h1>Écrivez-nous</h1><p class="muted page-intro">Une question ou une suggestion ? Envoyez-nous un message.</p>
  <form id="contact-form" class="contact-form" novalidate>
    <div class="form-field"><label for="name">Nom complet</label><input id="name" name="name" type="text" placeholder="Votre nom" required><small class="error" id="name-error"></small></div>
    <div class="form-field"><label for="email">Adresse e-mail</label><input id="email" name="email" type="email" placeholder="nom@exemple.com" required><small class="error" id="email-error"></small></div>
    <div class="form-field"><label for="subject">Sujet</label><input id="subject" name="subject" type="text" placeholder="Objet du message" required><small class="error" id="subject-error"></small></div>
    <div class="form-field"><label for="message">Message</label><textarea id="message" name="message" rows="5" placeholder="Votre message..." required></textarea><small class="error" id="message-error"></small></div>
    <button class="button" type="submit">Envoyer le message</button><p id="form-success" class="success" role="status"></p>
  </form>
</main>
<footer class="site-footer"><div class="container footer-inner"><p>© 2026 Mini Bibliothèque</p><p>Un projet web collaboratif</p></div></footer>
<script src="js/common.js"></script><script src="js/contact.js"></script>
</body></html>
